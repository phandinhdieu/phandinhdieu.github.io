<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
:root{--bg:#0b1020;--surface:#0f152b;--card:#111936;--text:#e7ecff;--muted:#9aa3c0;--accent:#5b8cff;--line:#1d274c}
@media(prefers-color-scheme:light){:root{--bg:#f7f8fc;--surface:#fff;--card:#fff;--text:#0f1530;--muted:#55607a;--accent:#3957ff;--line:#e7e9f4}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.9;font-size:18px;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.topbar{position:fixed;top:0;left:0;right:0;z-index:1000;backdrop-filter:blur(8px);background:color-mix(in srgb,var(--surface),transparent 25%);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--accent);color:#fff;text-decoration:none}
.wrap{max-width:900px;margin:70px auto 0;padding:20px;flex:1;width:100%}
.content{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.06);padding:30px}
header.page{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:18px;text-align:center}
header.page h1{font-family:'Merriweather',serif;font-weight:800;font-size:26px;margin:0 0 6px;line-height:1.3}
header.page p.meta{margin:4px 0 0;color:var(--muted);font-style:italic;font-size:15px}
.pdf-container{width:100%;margin-top:1rem}
.pdf-embed{width:100%;height:85vh;border:none;border-radius:8px;display:block}
.pdf-fallback{display:none;text-align:center;padding:2rem;background:var(--card);border-radius:8px;border:1px solid var(--line)}
.pdf-fallback p{color:var(--muted);margin-bottom:1rem}
@media(max-width:600px){
  .pdf-embed{height:70vh}
  header.page h1{font-size:20px}
  .wrap{padding:12px}
  .content{padding:20px 14px}
}
@media print{.topbar,.btn{display:none!important}body{background:#fff!important;color:#000!important}.content{border:0!important;box-shadow:none!important}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="btn" href="../index.html">Về Trang Phan Đình Diệu</a>
      <a class="btn" href="../khoahoc-giaoduc.html">← Khoa học &amp; Giáo dục</a>
      <a class="btn" href="khoahoc_files/1995_(VT)ChuongtrinhQuocGiaCNTT.pdf" target="_blank">Tải PDF</a>
    </div>
  </div>
  <div class="wrap">
    <main class="content">
      <header class="page">
        <h1>Chương trình Quốc gia về Công nghệ Thông tin</h1>
        <p class="meta">Bản viết tay · Phan Đình Diệu · 1995</p>
      </header>

      <div class="pdf-container">
        <embed
          class="pdf-embed"
          src="khoahoc_files/1995_(VT)ChuongtrinhQuocGiaCNTT.pdf"
          type="application/pdf"
          title="Chương trình Quốc gia về Công nghệ Thông tin – Bản viết tay 1995">
        <div class="pdf-fallback" id="fallback">
          <p>Trình duyệt của bạn không hiển thị PDF trực tiếp.</p>
          <a class="btn" href="khoahoc_files/1995_(VT)ChuongtrinhQuocGiaCNTT.pdf" target="_blank">Mở / Tải PDF</a>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Hiển thị fallback nếu embed không load được (thường xảy ra trên mobile)
    var embed = document.querySelector('.pdf-embed');
    embed.onerror = function(){
      embed.style.display = 'none';
      document.getElementById('fallback').style.display = 'block';
    };
  </script>
</body>
</html>
